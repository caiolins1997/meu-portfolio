# Implantação atrás do proxy Traefik do Coolify (rede "coolify"), com HTTPS automático (Let's Encrypt).
services:
  vora-sistema:
    build: .
    container_name: vora-sistema
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    volumes:
      - vora-data:/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.vora-https.redirectscheme.scheme=https
      - traefik.http.routers.vora-http.rule=Host(`${DOMINIO}`)
      - traefik.http.routers.vora-http.entrypoints=http
      - traefik.http.routers.vora-http.middlewares=vora-https
      - traefik.http.routers.vora-https.rule=Host(`${DOMINIO}`)
      - traefik.http.routers.vora-https.entrypoints=https
      - traefik.http.routers.vora-https.tls=true
      - traefik.http.routers.vora-https.tls.certresolver=letsencrypt
      - traefik.http.services.vora-sistema.loadbalancer.server.port=3000
volumes:
  vora-data:
networks:
  coolify:
    external: true
